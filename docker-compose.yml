name: patana
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: patana
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patana -d patana"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://patana:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/patana?schema=public
    command: ["./node_modules/.bin/prisma","db","push","--schema=patana-api/prisma/schema.prisma","--skip-generate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [private]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://patana:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/patana?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CUSTOMER_ORIGIN: ${CUSTOMER_ORIGIN:-http://localhost:8080}
      OWNER_ORIGIN: ${OWNER_ORIGIN:-http://localhost:8081}
    depends_on:
      db-init:
        condition: service_completed_successfully
    expose: ["4000"]
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [private]
  customer:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: {WEB_APP: customer, VITE_API_URL: /api}
    restart: unless-stopped
    ports: ["${CUSTOMER_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
    networks: [private]
  owner:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: {WEB_APP: owner, VITE_API_URL: /api}
    restart: unless-stopped
    ports: ["${OWNER_PORT:-8081}:80"]
    depends_on:
      api:
        condition: service_healthy
    networks: [private]
volumes:
  postgres_data:
networks:
  private:
