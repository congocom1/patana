services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patana
      POSTGRES_PASSWORD: patana
      POSTGRES_DB: patana
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patana -d patana"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: unless-stopped
volumes:
  pgdata:
