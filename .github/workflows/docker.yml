name: Docker Stack Validation
on:
  push:
    branches: [feat/full-docker-stack]
  pull_request:
    paths:
      - 'Dockerfile.*'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-dev-password-only
          JWT_SECRET: ci-testing-secret-not-for-production-at-all
        run: docker compose config -q
      - name: Build all application images
        run: docker compose build api customer owner
